<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15100b">
  <meta name="description" content="Guía, eventos y avisos de la alianza en Last Asylum">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Last Asylum · Alianza</title>
  <script>
    // Aplica el tema guardado antes de pintar (evita parpadeo).
    (function () {
      try {
        var t = localStorage.getItem('la_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/home" class="brand"><img src="/icons/icon-192.png" alt=""><span id="brand-name">Last Asylum</span></a>
    <div class="top-right">
      <div class="clock" id="clock"></div>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Tema">☾</button>
    </div>
  </header>

  <main id="view" class="view"><div class="center muted">⚙</div></main>

  <nav class="tabbar" id="tabbar" hidden>
    <a href="#/home" data-tab="home"><span class="ico">⌂</span><span data-i18n="nav_home"></span></a>
    <a href="#/events" data-tab="events"><span class="ico">⏱</span><span data-i18n="nav_events"></span></a>
    <a href="#/guides" data-tab="guides"><span class="ico">📜</span><span data-i18n="nav_guides"></span></a>
    <a href="#/chat/general" data-tab="chat"><span class="ico">✉</span><span data-i18n="nav_chat"></span><b class="dot" id="chat-dot" hidden></b></a>
    <a href="#/more" data-tab="more"><span class="ico">⚙</span><span data-i18n="nav_more"></span></a>
  </nav>

  <div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
